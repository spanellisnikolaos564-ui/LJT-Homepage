name: Jekyll build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Show build output
        run: |
          find _site -maxdepth 2 -type d | sort
          echo '---- index.html checks ----'
          grep -c 'SynLogic' _site/index.html || true
          grep -o 'jliugi@connect.ust.hk' _site/index.html | head -1 || true
          grep -o 'Vicent0205' _site/index.html | head -1 || true
          echo '---- publications ----'
          ls _site/publication
          echo '---- pages ----'
          ls _site
